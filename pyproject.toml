[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teloce-py"
description = "Python-native compiler and runtime for Teloce .vel Single File Components"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Aldane Hutchinson" }
]
maintainers = [
    { name = "Aldane Hutchinson" }
]
keywords = [
    "teloce",
    "compiler",
    "sfc",
    "template-engine",
    "python",
    "flask",
    "django",
    "fastapi",
    "flaxon"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Compilers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/aldanedev-create/teloce-py"
Documentation = "https://github.com/aldanedev-create/teloce-py/tree/main/docs"
Repository = "https://github.com/aldanedev-create/teloce-py"
Issues = "https://github.com/aldanedev-create/teloce-py/issues"
Changelog = "https://github.com/aldanedev-create/teloce-py/blob/main/CHANGELOG.md"

[project.scripts]
teloce = "teloce.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"teloce.runtime" = ["*.js"]

[tool.setuptools.dynamic]
version = { attr = "teloce.version.__version__" }

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
