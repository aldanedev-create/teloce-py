name: MinifyJS integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and example test dependencies
        run: python -m pip install -e . minifyjs==0.1.3 pytest jinja2 flask 'flask-admin<2' 'wtforms<3' flask-sqlalchemy 'flaxon; python_version >= "3.11"'
      - name: Run suite
        run: python -m pytest tests -q
  browser-and-parity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install published MinifyJS and browser tools
        run: |
          python -m pip install -e . minifyjs==0.1.3 pytest playwright==1.58.0
          python -m playwright install --with-deps chromium
          npm install --prefix browser-tools esbuild@0.28.2
      - name: Check production bundles in Chromium
        env:
          TELOCE_BROWSER_TESTS: '1'
        run: python -m pytest tests/integration/test_minifyjs_browser.py tests/integration/test_targeted_regions_browser.py -q
      - name: Compare identical inputs with Node esbuild
        run: python scripts/benchmark_minifyjs.py --esbuild browser-tools/node_modules/.bin/esbuild
